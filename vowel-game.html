<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>한글 파닉스 - 모음 합치기 게임</title>
  <!-- Google Fonts: Gowun Dodum & Jua (태블릿 학습용 둥글고 예쁜 폰트) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/sorting-game.css">
  <link rel="stylesheet" href="/vowel-game.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-area">
        <a href="/index.html" class="btn-back" title="브로마이드 제작기로 돌아가기">
          <span class="back-icon">🎨</span> 돌아가기
        </a>
        <div class="logo-text">
          <h1>한글 파닉스 모음 합치기 게임</h1>
          <p>Hangul Phonics Combine Game</p>
        </div>
      </div>

      <!-- Lesson Selector -->
      <div class="lesson-selector">
        <span class="selector-label">레슨 선택:</span>
        <div class="lesson-buttons" id="lesson-buttons-container">
          <!-- Dynamically populated lesson buttons -->
        </div>
      </div>
    </header>

    <!-- Main Game Play Area -->
    <main class="game-main">
      <!-- Prompt Bar (소리 듣기) -->
      <div class="prompt-bar">
        <button id="btn-replay-sound" class="sound-btn" title="소리 다시 듣기">🔊</button>
        <div class="prompt-text">
          <h2 id="prompt-title">소리를 잘 듣고 합쳐요!</h2>
          <div id="prompt-progress" class="progress-dots"></div>
        </div>
      </div>

      <!-- Combine Stage (합치기 판) -->
      <div class="combine-stage" id="combine-stage">
        <div class="slot" id="slot-consonant" data-accept="consonant">
          <span class="slot-hint"><span class="hint-emoji">🐱</span>자음 친구</span>
        </div>
        <div class="combine-op">＋</div>
        <div class="slot" id="slot-vowel" data-accept="vowel">
          <span class="slot-hint"><span class="hint-emoji">🧰</span>모음 도구</span>
        </div>
        <div class="combine-op equals">＝</div>
        <div class="result-box" id="result-box">
          <span class="result-q">?</span>
        </div>
      </div>

      <!-- Card Trays (자음 친구 / 모음 도구) -->
      <div class="tray-wrapper">
        <div class="tray">
          <div class="tray-title">🐱 자음 친구를 끌어요</div>
          <div class="tray-bank" id="consonant-bank"></div>
        </div>
        <div class="tray">
          <div class="tray-title">🧰 모음 도구를 끌어요</div>
          <div class="tray-bank" id="vowel-bank"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Success/Celebration Modal -->
  <div class="celebration-overlay" id="celebration-overlay">
    <div class="celebration-modal">
      <div class="trophy-icon">🎉</div>
      <h2>우와, 대단해요!</h2>
      <p>소리를 듣고 글자를 모두 합쳤어요!</p>
      <div class="modal-buttons">
        <button id="btn-next-lesson" class="btn btn-next">다음 레슨 하기 ➔</button>
        <button id="btn-replay" class="btn btn-replay">다시 하기 ↺</button>
      </div>
    </div>
  </div>

  <!-- Loading Screen Overlay -->
  <div id="loading-screen" class="loading-screen">
    <div class="loading-card">
      <span class="loading-icon">🎨</span>
      <h3>한글 친구들을 불러오고 있어요...</h3>
      <div class="progress-bar-container">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <p id="loading-status">0% 완료</p>
    </div>
  </div>

  <!-- Audio Context Activation Bar (for Safari/iOS Autoplay policy) -->
  <div id="audio-init-overlay" class="audio-init-overlay">
    <div class="audio-init-card">
      <span class="music-icon">🎵</span>
      <h3>소리를 들으며 글자를 합쳐요!</h3>
      <p>화면을 누르면 게임이 시작됩니다.</p>
      <button id="btn-start-game" class="btn-start">게임 시작하기</button>
    </div>
  </div>

  <!-- Confetti Canvas -->
  <canvas id="confetti-canvas"></canvas>

  <script type="module" src="/vowel-game.js"></script>
</body>
</html>
